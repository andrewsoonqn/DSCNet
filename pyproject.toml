[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dscnet-urop"
version = "0.1.0"
description = "Reproducible 3D DSCNet experiments for MiniVess segmentation"
readme = "docs/usage.md"
requires-python = ">=3.11"
dependencies = [
  "Flask-WTF==1.3.0",
  "SimpleITK==2.5.3",
  "hydra-core==1.3.2",
  "marimo==0.19.9",
  "matplotlib==3.10.8",
  "mlflow==3.16.0",
  "monai==1.5.2",
  "nibabel==5.3.3",
  "numpy==2.3.5",
  "omegaconf==2.3.0",
  "pandas==2.3.2",
  "scikit-image==0.26.0",
  "scikit-learn==1.8.0",
  "scipy==1.17.0",
  "seaborn==0.13.2",
  "tifffile==2026.1.28",
  "torch==2.10.0",
  "torchinfo==1.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
